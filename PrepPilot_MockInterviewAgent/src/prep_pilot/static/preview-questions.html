<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Questions Preview</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg, #0f172a); color: var(--text, #e2e8f0); min-height: 100vh; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; }
        .step { background: var(--surface, #1e293b); border-radius: 12px; padding: 2rem; }
        .progress-bar { height: 4px; background: #334155; border-radius: 2px; margin-bottom: 1.5rem; }
        .progress-fill { height: 100%; width: 40%; background: var(--progress, #2563eb); border-radius: 2px; }
        .question-box { background: var(--qBoxBg, #0f172a); border: 1px solid var(--qBoxBorder, #334155); border-radius: var(--qBoxRadius, 8px); padding: var(--qBoxPadding, 1.5rem); margin-bottom: 1rem; }
        .question-number { color: var(--qNumColor, #38bdf8); font-weight: 700; font-size: 0.85rem; text-transform: uppercase; margin-bottom: 0.5rem; }
        .question-text { font-size: 1.1rem; line-height: 1.6; color: var(--qTextColor, #e2e8f0); }
        textarea { width: 100%; min-height: var(--inputHeight, 120px); padding: 0.75rem; border-radius: 8px; border: 1px solid #334155; background: var(--inputBg, #0f172a); color: #e2e8f0; font-size: 1rem; margin-bottom: 1rem; resize: vertical; }
        button { background: var(--submitBtn, #2563eb); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: 600; }
        .category-tag { display: inline-block; background: #1e3a5f; color: #7dd3fc; padding: 0.2rem 0.6rem; border-radius: 4px; font-size: 0.75rem; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="step">
            <div class="progress-bar" id="progress-bar"><div class="progress-fill"></div></div>
            <div class="question-box">
                <div class="question-number" id="q-number">Question 2 of 5</div>
                <div class="category-tag" id="q-category">behavioral</div>
                <p class="question-text" id="q-text">Describe a time you had to debug a complex production issue. What was your approach and what was the outcome?</p>
            </div>
            <textarea placeholder="Type your answer here...">At TechCorp, our payment service went down during peak hours. I quickly identified the root cause was database connection pool exhaustion by analyzing the error logs and metrics dashboard...</textarea>
            <button>Submit Answer</button>
        </div>
    </div>
    <script>
        window.addEventListener('message', (event) => {
            if (event.data && event.data.type === 'theme-update' && event.data.theme.questions) {
                const q = event.data.theme.questions;
                const root = document.documentElement.style;
                if (q.colors) {
                    root.setProperty('--qBoxBg', q.colors.boxBg);
                    root.setProperty('--qBoxBorder', q.colors.boxBorder);
                    root.setProperty('--qNumColor', q.colors.numColor);
                    root.setProperty('--qTextColor', q.colors.textColor);
                    root.setProperty('--inputBg', q.colors.inputBg);
                    root.setProperty('--submitBtn', q.colors.submitBtn);
                    root.setProperty('--progress', q.colors.progressFill);
                }
                if (q.layout) {
                    root.setProperty('--qBoxPadding', q.layout.boxPadding);
                    root.setProperty('--qBoxRadius', q.layout.boxRadius);
                    root.setProperty('--inputHeight', q.layout.inputHeight);
                }
                if (q.sections !== undefined) {
                    document.getElementById('progress-bar').style.display = q.sections.showProgress ? 'block' : 'none';
                    document.getElementById('q-category').style.display = q.sections.showCategory ? 'inline-block' : 'none';
                    document.getElementById('q-number').style.display = q.sections.showNumber ? 'block' : 'none';
                }
            }
        });
    </script>
</body>
</html>
